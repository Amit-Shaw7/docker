name: todo-app

x-database-url: &database-url
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: brings the database schema in line with the emitted contract
  migrate:
    build:
      context: .
      target: migrate
    restart: "no"
    environment:
      <<: *database-url
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      <<: *database-url
      PORT: "5000"
    ports:
      - "${APP_PORT:-5000}:5000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
